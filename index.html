<!DOCTYPE html>
<html lang="en">

<title>WordQuest: Learn &amp; Play</title>
<style>
:root{--p:#6956E8;--y:#FFD45A;--b:#61C7F2;--bg:#F7F6FF;--t:#282344;--ok:#32B879;--bad:#E8574F;--cd:#fff;--m:#6d6990;--ln:#e8e5fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);overflow:hidden;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--t)}
h1,h2,h3,p{margin:0}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 24px}
nav{display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0;font-size:12px;font-weight:600;color:var(--m);min-height:58px}
nav button.on{color:var(--p);font-weight:800}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;color:var(--p)}
.lg{width:38px;height:38px;border-radius:12px;background:var(--y);color:var(--t);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;transform:rotate(-6deg)}
.hd{font-size:30px;line-height:1.1;font-weight:900;letter-spacing:-.5px;margin:16px 0 14px}
h2{font-size:19px;font-weight:800;margin:22px 0 10px}
.card{background:var(--cd);border-radius:22px;padding:16px;box-shadow:0 3px 0 var(--ln)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--cd);border-radius:18px;padding:10px 4px;text-align:center;box-shadow:0 3px 0 var(--ln)}
.stat b{display:block;font-size:22px;font-weight:900}
.stat small{color:var(--m);font-size:12px;font-weight:600}
.bar{height:12px;border-radius:12px;background:var(--ln);overflow:hidden}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:18px;font-weight:800;width:100%;background:var(--p);color:#fff;box-shadow:0 5px 0 #4b3bb8}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4b3bb8}
.btn.y{background:var(--y);color:var(--t);box-shadow:0 5px 0 #d9a92a}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 #1f8a59}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 #b13f38}
.btn.w{background:#fff;color:var(--p);box-shadow:0 5px 0 var(--ln);border:2px solid var(--ln)}
.two{display:flex;gap:12px;margin-top:16px}.two>*{flex:1}
.cats{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px}
.cc{flex:0 0 auto;width:132px;border-radius:22px;padding:14px 12px;color:#fff;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.16)}
.cc span{font-size:30px;display:block}.cc b{display:block;font-size:14px;margin-top:6px;line-height:1.2}.cc small{opacity:.9;font-size:12px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bd{background:var(--cd);border-radius:16px;padding:10px 4px;text-align:center;box-shadow:0 3px 0 var(--ln);font-size:11px;font-weight:700}
.bd span{display:block;font-size:28px}
.bd.lk{opacity:.4;filter:grayscale(1)}
.srch{display:flex;align-items:center;gap:8px;background:var(--cd);border:2px solid var(--ln);border-radius:16px;padding:0 14px;min-height:50px;color:var(--m)}
.srch input{flex:1;border:0;outline:0;background:none;min-height:46px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{flex:0 0 auto;min-height:40px;padding:0 16px;border-radius:999px;background:var(--cd);border:2px solid var(--ln);font-weight:700;font-size:14px;color:var(--m)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.ch{display:flex;align-items:center;gap:12px;width:100%;color:#fff;border-radius:20px;padding:14px;text-align:left;margin-top:12px;box-shadow:0 4px 0 rgba(0,0,0,.16)}
.ch span{font-size:28px}.ch b{flex:1;font-size:17px}.ch small{opacity:.95;font-weight:600}
.ls{display:flex;align-items:center;gap:10px;width:100%;background:var(--cd);border-radius:16px;padding:12px 14px;margin-top:8px;text-align:left;box-shadow:0 3px 0 var(--ln)}
.ls b{flex:1}.ls small{color:var(--m);font-weight:600}
.tag{font-size:12px;font-weight:800;border-radius:10px;padding:2px 9px;background:#e7f7ef;color:#1b7a4f}
.tag.m{background:#fff3cf;color:#7a5a00}.tag.h{background:#fde5e3;color:#a5352e}
.wd{background:var(--cd);border-radius:18px;padding:14px;margin-top:10px;box-shadow:0 3px 0 var(--ln)}
.wd p{color:var(--m);margin-top:4px}.wd i{display:block;margin-top:4px}
.emp{text-align:center;color:var(--m);padding:22px 10px}.emp span{font-size:44px;display:block}
.lgi{display:flex;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln);font-size:14px}
.lgi small{color:var(--m);white-space:nowrap}
.mod,#g{position:fixed;inset:0;z-index:30}
.mod{background:rgba(40,35,68,.55);display:flex;align-items:flex-end}
.mod>div{background:var(--bg);width:100%;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:sl .28s cubic-bezier(.2,.9,.3,1);max-height:92%;overflow-y:auto}
@keyframes sl{from{transform:translateY(100%)}}
#g{background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.gh{display:flex;align-items:center;gap:12px;padding:10px 14px}
.gh .bar{flex:1}
.x{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--m)}
#gb{flex:1;overflow-y:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.fcard{background:linear-gradient(160deg,var(--p),#8b78ff);color:#fff;border-radius:28px;padding:26px 20px;min-height:280px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;box-shadow:0 6px 0 #4b3bb8}
.fcard.fl{background:#fff;color:var(--t);box-shadow:0 6px 0 var(--ln)}
.fw{font-size:34px;font-weight:900;word-break:break-word}
.fcard .ex{color:var(--p);font-style:italic}
.lv{font-size:12px;font-weight:800;background:var(--y);color:var(--t);border-radius:10px;padding:2px 10px}
.q{font-size:21px;font-weight:800;margin:10px 0 6px}
.sen{background:var(--cd);border-radius:16px;padding:12px 14px;margin:6px 0 4px;font-style:italic}
.opt{display:block;width:100%;text-align:left;background:var(--cd);border:2px solid var(--ln);border-radius:18px;padding:14px;margin-top:10px;font-weight:600;min-height:54px;box-shadow:0 3px 0 var(--ln)}
.opt.ok{background:#e4f7ee;border-color:var(--ok)}.opt.no{background:#fde8e6;border-color:var(--bad)}
.fb{border-radius:16px;padding:12px 14px;margin-top:12px;background:#fff;border:2px solid var(--ln);font-size:15px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mt button{border-radius:16px;padding:12px 8px;background:var(--cd);border:2px solid var(--ln);font-weight:700;font-size:14px;min-height:62px;box-shadow:0 3px 0 var(--ln)}
.mt .d{font-weight:500;font-size:13px}
.mt .sel{border-color:var(--p);background:#eeeaff}.mt .done{background:#e4f7ee;border-color:var(--ok);opacity:.7}.mt .bad{background:#fde8e6;border-color:var(--bad);animation:sk .35s}
@keyframes sk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.si{width:100%;min-height:56px;border-radius:16px;border:2px solid var(--ln);padding:0 16px;font-size:22px;font-weight:700;text-align:center;background:#fff;margin-top:12px}
.pat{letter-spacing:5px;font-weight:800;font-size:22px;text-align:center;color:var(--p);margin-top:10px}
.res{text-align:center;padding-top:14px}.res .e{font-size:70px}.res h2{font-size:28px;margin:6px 0}
.res p{margin:6px 0;color:var(--m);font-weight:600}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--t);color:#fff;padding:11px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90%;text-align:center;font-size:14px;font-weight:600}
#toast.on{opacity:1;transform:translate(-50%,0)}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#4b3bd0,var(--p) 45%,#8b78ff);color:#fff;transition:opacity .5s,visibility .5s;text-align:center;padding:20px;overflow:hidden}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
.sl{width:108px;height:108px;border-radius:32px;background:var(--y);color:var(--t);display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900;animation:pop .9s cubic-bezier(.2,1.3,.4,1) both;box-shadow:0 8px 0 #d9a92a;transform:rotate(-6deg)}
.wq{display:flex;font-size:34px;font-weight:900;letter-spacing:-.5px}
.wq span{animation:bn 1.1s ease-in-out infinite}
.wq span:nth-child(2){animation-delay:.08s}.wq span:nth-child(3){animation-delay:.16s}.wq span:nth-child(4){animation-delay:.24s}.wq span:nth-child(5){animation-delay:.32s}.wq span:nth-child(6){animation-delay:.4s}.wq span:nth-child(7){animation-delay:.48s}.wq span:nth-child(8){animation-delay:.56s}.wq span:nth-child(9){animation-delay:.64s}
#splash p{opacity:.92;font-weight:600;animation:up .7s .3s both}
.fl1,.fl2,.fl3{position:absolute;font-size:30px;animation:fl 3s ease-in-out infinite;opacity:.8}
.fl1{left:12%;top:18%}.fl2{right:14%;top:26%;animation-delay:.6s}.fl3{left:22%;bottom:18%;animation-delay:1.2s}
.pb{width:180px;height:8px;border-radius:8px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:14px}
.pb i{display:block;height:100%;width:0;background:var(--y);border-radius:8px;animation:ld 1.9s ease-out forwards}
@keyframes pop{from{transform:scale(.3) rotate(-30deg);opacity:0}}
@keyframes up{from{transform:translateY(14px);opacity:0}}
@keyframes bn{50%{transform:translateY(-12px)}}
@keyframes fl{50%{transform:translateY(-14px) rotate(10deg)}}
@keyframes ld{to{width:100%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>

function ask(t,ok){return new Promise(r=>{$('mdt').textContent=t;$('mdy').textContent=ok||'OK';$('md').hidden=false;const d=v=>{$('md').hidden=true;r(v)};$('mdy').onclick=()=>d(true);$('mdn').onclick=()=>d(false)})}
function shuf(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const sample=(a,n)=>shuf(a).slice(0,n);
const dayOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dayOf(new Date()),yday=()=>{const d=new Date();return dayOf(new Date(d.getFullYear(),d.getMonth(),d.getDate()-1))};
function seeded(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
function dailyWords(){const r=seeded('wq'+today()),a=[...ALL];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,5)}

const KEY='wordquest.v1';
const def=()=>({xp:0,done:{},known:{},streak:0,best:0,last:'',q:{a:0,c:0},sp:0,perf:0,xpd:{d:'',k:{}},today:{d:'',xp:0},daily:{d:'',s:0,n:0},ach:{},log:[],goal:30});
function load(){const d=def();try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&typeof o==='object')for(const k in d){const v=o[k];if(v===undefined||v===null||typeof v!==typeof d[k]||Array.isArray(v)!==Array.isArray(d[k]))continue;if(typeof v==='number'&&!isFinite(v))continue;d[k]=v}}catch(e){}
  ['a','c'].forEach(k=>{if(!isFinite(d.q[k])||d.q[k]<0)d.q[k]=0});d.log=d.log.filter(x=>x&&typeof x.t==='string').slice(0,15);if(![20,30,50].includes(d.goal))d.goal=30;return d}
let S=load(),warned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!warned){warned=true;toast('Progress cannot be saved in this browser.')}}}
function roll(){const t=today();if(S.xpd.d!==t)S.xpd={d:t,k:{}};if(S.today.d!==t)S.today={d:t,xp:0}}
function award(key,xp){roll();if(S.xpd.k[key])return 0;S.xpd.k[key]=1;S.xp+=xp;S.today.xp+=xp;return xp}
const streakNow=()=>S.last===today()||S.last===yday()?S.streak:0;
const knownCount=()=>Object.keys(S.known).length;
const ACH=[
 {id:'first',e:'🌱',n:'First Steps',d:'Complete a lesson',f:()=>Object.keys(S.done).length>=1},
 {id:'w10',e:'📚',n:'Word Collector',d:'Learn 10 words',f:()=>knownCount()>=10},
 {id:'w50',e:'🎓',n:'Vocab Pro',d:'Learn 50 words',f:()=>knownCount()>=50},
 {id:'perf',e:'⚡',n:'Quiz Whiz',d:'Perfect quiz of 5+',f:()=>S.perf>=1},
 {id:'sp',e:'✍️',n:'Sharp Speller',d:'10 correct spellings',f:()=>S.sp>=10},
 {id:'s3',e:'🔥',n:'3-Day Streak',d:'Learn 3 days in a row',f:()=>S.best>=3},
 {id:'s7',e:'🏆',n:'7-Day Streak',d:'Learn 7 days in a row',f:()=>S.best>=7},
 {id:'xp',e:'⭐',n:'100 XP',d:'Earn 100 XP',f:()=>S.xp>=100},
 {id:'dc',e:'👑',n:'Daily Champion',d:'Finish a Daily Challenge',f:()=>S.daily.n>=1},
 {id:'ex',e:'🌍',n:'Explorer',d:'Finish lessons in 5 categories',f:()=>new Set(Object.keys(S.done).map(i=>i.slice(0,2))).size>=5}];
function checkAch(){ACH.forEach(a=>{if(!S.ach[a.id]&&a.f()){S.ach[a.id]=today();toast('Achievement unlocked: '+a.n+' '+a.e)}})}
function session(g){const t=today();if(S.last!==t){S.streak=S.last===yday()?S.streak+1:1;S.last=t;S.best=Math.max(S.best,S.streak)}
  let b=0;const m=g.meta;if(m.lid&&!S.done[m.lid]){S.done[m.lid]={d:t};b+=award('L:'+m.lid,10)}
  if(m.daily){S.daily={d:t,s:g.ok,n:S.daily.n+1};b+=award('D:'+t,15)}
  if(g.mode==='qz'&&g.tot>=5&&g.ok===g.tot)S.perf++;
  S.log.unshift({t:m.label+' · '+MODES[g.mode],x:g.xp+b,ts:Date.now()});S.log=S.log.slice(0,15);checkAch();save();return b}

/* ===== game engine ===== */
let G=null;
function open(mode,words,meta){G={mode,words,meta,i:0,xp:0,ok:0,tot:0};$('ls').hidden=true;$('g').hidden=false;({fc:iFc,qz:iQz,mt:iMt,sp:iSp})[mode]();gr()}
function gr(){const g=G;if(!g)return;({fc:rFc,qz:rQz,mt:rMt,sp:rSp})[g.mode]();$('gb').scrollTop=0}
const prog=p=>$('gp').style.width=Math.round(p*100)+'%';
function fin(){const g=G;g.fin=1;if(g.mode==='sp')g.tot=g.qs.length;const b=session(g),n=g.tot||g.words.length,pct=g.tot?Math.round(g.ok/g.tot*100):100;prog(1);
 const good=g.mode==='fc'||g.mode==='mt'||pct>=70;
 $('gb').innerHTML=`<div class="res"><div class="e">${good?'🎉':'💪'}</div><h2>${good?'Great job!':'Keep going!'}</h2>${g.mode==='fc'?`<p>You reviewed ${g.words.length} words</p>`:g.mode==='mt'?`<p>All ${g.words.length} pairs matched · ${g.miss} mistake${g.miss===1?'':'s'}</p>`:`<p>Score: ${g.ok} / ${g.tot} (${pct}%)</p>`}<p style="font-size:22px;color:var(--p);font-weight:900">+${g.xp+b} XP</p>${b?`<p>Includes bonus +${b} XP</p>`:''}<p>🔥 Streak: ${streakNow()} day${streakNow()===1?'':'s'}</p></div><div class="two">${g.meta.daily?'':'<button class="btn w" data-a="replay">Play again</button>'}<button class="btn" data-a="gx2">Done</button></div>`;render()}
/* flashcards */
function iFc(){G.q=[...G.words];G.flip=0;G.kn=0}
function rFc(){const g=G;if(!g.q.length)return fin();prog(g.kn/g.words.length);const w=g.q[0];
 $('gb').innerHTML=`<p style="text-align:center;color:var(--m);font-weight:700;margin-bottom:10px">${g.kn} / ${g.words.length} known</p><button class="fcard ${g.flip?'fl':''}" data-a="flip" style="width:100%;border:0;font:inherit"><span class="lv">${LV[w.l]}</span><div class="fw">${esc(w.w)}</div>${g.flip?`<p style="font-size:18px">${esc(w.d)}</p><p class="ex">“${esc(w.e)}”</p>${w.t?`<p>${esc(w.t)}</p>`:''}`:'<small style="opacity:.85">Tap to reveal the meaning</small>'}</button>${g.flip?'<div class="two"><button class="btn bad" data-a="again">Practice again</button><button class="btn ok" data-a="know">Know it</button></div>':''}`}
/* quiz */
function mkQ(w,i){const re=new RegExp('\\b'+escRe(w.w)+'\\w*','i');
 if(i%2&&re.test(w.e)){const o=sample(ALL.filter(x=>x.k!==w.k),3);return{w,p:'Which word fits the sentence?',s:w.e.replace(re,'_____'),ch:shuf([w,...o].map(x=>({t:x.w,ok:x===w})))}}
 const o=sample(ALL.filter(x=>x.k!==w.k&&x.d!==w.d),3);return{w,p:'What does “'+w.w+'” mean?',ch:shuf([w,...o].map(x=>({t:x.d,ok:x===w})))}}
function iQz(){G.qs=shuf(G.words).map(mkQ);G.ans=null}
function rQz(){const g=G;if(g.i>=g.qs.length)return fin();prog(g.i/g.qs.length);const q=g.qs[g.i],a=g.ans;
 $('gb').innerHTML=`<p style="color:var(--m);font-weight:700">Question ${g.i+1} of ${g.qs.length}</p><div class="q">${esc(q.p)}</div>${q.s?`<div class="sen">${esc(q.s)}</div>`:''}${q.ch.map((c,i)=>`<button class="opt ${a!==null?(c.ok?'ok':i===a?'no':''):''}" data-a="opt" data-i="${i}" ${a!==null?'disabled':''}>${esc(c.t)}</button>`).join('')}${a!==null?`<div class="fb">${q.ch[a].ok?'✅ <b>Correct!</b>':'❌ <b>Not quite.</b>'} “${esc(q.w.w)}” means: ${esc(q.w.d)}.<br><i>Example: ${esc(q.w.e)}</i></div><button class="btn" style="margin-top:14px" data-a="next">${g.i+1>=g.qs.length?'See results':'Next'}</button>`:''}`}
function answer(i){const g=G,q=g.qs[g.i];if(g.ans!==null)return;g.ans=i;g.tot++;S.q.a++;if(q.ch[i].ok){g.ok++;S.q.c++;g.xp+=award((g.meta.daily?'dq:':'qz:')+q.w.k,5)}save();rQz()}
/* matching */
function iMt(){const w=G.words.slice(0,5);G.n=w.length;G.L=shuf(w);G.Rr=shuf(w);G.m={};G.sel=null;G.miss=0;G.bad=null;G.words=w}
function rMt(){const g=G,c=Object.keys(g.m).length;prog(c/g.n);const cl=(k,s)=>(g.m[k]?'done':g.sel&&g.sel.side===s&&g.sel.k===k?'sel':g.bad&&g.bad.includes(k)?'bad':'');
 $('gb').innerHTML=`<div class="q">Match each word with its meaning</div><p style="color:var(--m);font-weight:600">${c} / ${g.n} matched · ${g.miss} mistake${g.miss===1?'':'s'}</p><div class="mt"><div style="display:grid;gap:10px">${g.L.map(w=>`<button class="${cl(w.k,'l')}" data-a="mtl" data-i="${w.k}" ${g.m[w.k]?'disabled':''}>${esc(w.w)}</button>`).join('')}</div><div style="display:grid;gap:10px">${g.Rr.map(w=>`<button class="d ${cl(w.k,'r')}" data-a="mtr" data-i="${w.k}" ${g.m[w.k]?'disabled':''}>${esc(w.d)}</button>`).join('')}</div></div><button class="btn w" style="margin-top:16px" data-a="mtre">Restart</button>`}
function mtTap(side,k){const g=G;if(g.m[k])return;if(!g.sel||g.sel.side===side){g.sel={side,k};return rMt()}
 const lk=side==='r'?g.sel.k:k,rk=side==='r'?k:g.sel.k;g.sel=null;
 if(lk===rk){g.m[lk]=1;g.ok++;g.tot++;g.xp+=award('mt:'+lk,3);save();if(Object.keys(g.m).length===g.n)return fin();rMt()}
 else{g.miss++;g.bad=[lk,rk];rMt();setTimeout(()=>{if(G===g&&!g.fin){g.bad=null;rMt()}},450)}}
/* spelling */
function iSp(){G.qs=shuf(G.words);G.h=0;G.tr=0;G.st=null;G.msg=''}
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();
function rSp(){const g=G;if(g.i>=g.qs.length)return fin();prog(g.i/g.qs.length);const w=g.qs[g.i],re=new RegExp('\\b'+escRe(w.w)+'\\w*','i'),pat=[...w.w].map((c,i)=>c===' '?'  ':i<g.h?c:'_').join(' ');
 $('gb').innerHTML=`<p style="color:var(--m);font-weight:700">Word ${g.i+1} of ${g.qs.length}</p><div class="q">Which word means this?</div><div class="sen" style="font-style:normal">${esc(w.d)}</div><div class="sen">${esc(w.e.replace(re,'_____'))}</div><div class="pat">${esc(pat)}</div>
 ${g.st?`<div class="fb">${g.st==='ok'?'✅ <b>Correct!</b>':'The answer is <b>'+esc(w.w)+'</b>.'}</div><button class="btn" style="margin-top:14px" data-a="snext">${g.i+1>=g.qs.length?'See results':'Next'}</button>`:`<input class="si" id="si" maxlength="40" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type the word"><p style="color:${g.msg?'var(--bad)':'var(--m)'};text-align:center;margin-top:8px;min-height:22px;font-weight:600">${esc(g.msg)}</p><div class="two" style="margin-top:6px"><button class="btn y" data-a="hint">Hint</button><button class="btn" data-a="check">Check</button></div>${g.tr>=2?'<button class="btn w" style="margin-top:12px" data-a="reveal">Show answer</button>':''}`}`;
 const i=$('si');if(i){i.onkeydown=e=>{if(e.key==='Enter')check()};setTimeout(()=>i.focus(),50)}}
function check(){const g=G,w=g.qs[g.i],i=$('si'),v=norm(i.value);if(!v){g.msg='Type your answer first.';return rSp()}
 if(!/^[a-z' -]+$/.test(v)){g.msg='Use letters only.';return rSp()}
 g.tot++;if(v===w.w.toLowerCase()){g.ok++;S.sp++;g.xp+=award('sp:'+w.k,g.h?2:5);g.st='ok';g.msg='';save();checkAch()}else{g.tr++;g.msg=g.tr>=2?'Not quite. You can show the answer.':'Not quite. Try again or use a hint.'}rSp()}

/* ===== events ===== */
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i;
 switch(a){
  case 'tab':tab=i;render();break;
  case 'start':openLesson(nextLesson().id);break;
  case 'cat':openCat=openCat===+i?-1:+i;learnList();break;
  case 'catgo':tab='learn';openCat=+i;lq='';lvl=0;render();break;
  case 'lvl':lvl=+i;Q('[data-a=lvl]').forEach(x=>x.classList.toggle('on',+x.dataset.i===lvl));learnList();break;
  case 'lesson':openLesson(i);break;
  case 'lsx':$('ls').hidden=true;break;
  case 'mode':{const l=LESSONS.find(x=>x.id===b.dataset.l);open(i,l.words,{lid:l.id,label:l.n,l:l});break}
  case 'daily':if(dailyDone())toast('You already finished today\'s challenge.');else open('qz',dailyWords(),{daily:1,label:'Daily Challenge'});break;
  case 'mix':open('qz',sample(ALL,10),{label:'Mixed Quiz'});break;
  case 'spr':open('sp',sample(ALL,8),{label:'Spelling Sprint'});break;
  case 'mm':open('mt',sample(ALL,5),{label:'Match Mania'});break;
  case 'goal':S.goal=+i;save();render();break;
  case 'reset':if(await ask('Reset ALL progress, XP, streak and badges? This cannot be undone.','Reset')){S=def();save();render();toast('Progress reset')}break;
  case 'gx':if(G&&!G.fin&&!await ask('Leave this activity? XP you already earned is kept, but it will not count as completed.','Leave'))break;
  case 'gx2':$('g').hidden=true;G=null;render();break;
  case 'replay':{const g=G,m=g.meta,w=m.l?m.l.words:g.mode==='qz'?sample(ALL,10):g.mode==='sp'?sample(ALL,8):sample(ALL,5);open(g.mode,w,m);break}
  case 'flip':G.flip=1;rFc();break;
  case 'again':G.q.push(G.q.shift());G.flip=0;rFc();break;
  case 'know':{const w=G.q.shift();if(!S.known[w.k]){S.known[w.k]=1}G.xp+=award('fc:'+w.k,2);G.kn++;G.flip=0;save();checkAch();rFc();break}
  case 'opt':answer(+i);break;
  case 'next':G.i++;G.ans=null;rQz();break;
  case 'mtl':mtTap('l',i);break;
  case 'mtr':mtTap('r',i);break;
  case 'mtre':{const g=G;g.L=shuf(g.words);g.Rr=shuf(g.words);g.m={};g.sel=null;g.miss=0;g.ok=0;g.tot=0;rMt();break}
  case 'hint':{const w=G.qs[G.i];if(G.h<w.w.length-1)G.h++;G.msg='';rSp();break}
  case 'check':check();break;
  case 'reveal':G.st='shown';rSp();break;
  case 'snext':G.i++;G.h=0;G.tr=0;G.st=null;G.msg='';rSp();break}});
document.addEventListener('input',e=>{if(e.target.id==='lq'){lq=e.target.value;learnList()}});
window.addEventListener('pagehide',save);

/* ===== start ===== */
render();
setTimeout(()=>{$('splash').classList.add('out');setTimeout(()=>$('splash').remove(),700)},2000);
</script>
</body>
</html>
